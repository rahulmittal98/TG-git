    <!-- git and github
            Git is very simple version control system
                fundamental things:
                  1. apne code ka history maintain krta hai
                  2. har change ko track kr skte hai
                  3. if anything done wrong, we can revert to old git version
                  
            Github = ek normal cloud platform where we can host our git repo
            
            why to use any cloud platform
                1. backup
                2. team collaboration
                3. project sharing
            
            Git:
             1. works on local machine
             2. code tracking
             3. can work offline also
             
            Github: 
             1. works on internet/ cloud
             2. code hosting
             3. internet required -
             
            Important terms:
              1. Repository (repo): Project folder 
              2. Commit: Save checkpoint
              3. Push: Code ko github pe upload krna
              4. pull: latest code ko download krna
              5. clone: existing repo ko copy krna apne local system mei
              6. branches: separate working version
              
            git basic commands: 
              1. git config --global user.name "Rahul Mittal" -> as getter or setter
              2. git add filename or git add . [for all files]
              3. git commit -m "added base project"-->
